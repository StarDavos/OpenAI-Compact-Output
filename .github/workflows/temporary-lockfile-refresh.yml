name: Temporary lockfile refresh

on:
  push:
    branches:
      - fix/clipboard-r5-exact-copy

permissions:
  contents: write

jobs:
  refresh:
    if: "${{ github.event.head_commit.message != 'chore: refresh lockfile' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/clipboard-r5-exact-copy
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Use current npm 11
        run: |
          npm install --global npm@11.19.1
          npm --version

      - name: Rebuild reproducible lockfile cleanly
        shell: bash
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify dependency audit
        run: npm audit --audit-level=high

      - name: Commit lockfile only
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "Star Davos Software"
          git config user.email "42783831+StarDavos@users.noreply.github.com"
          git commit -m "chore: refresh lockfile"
          git push origin HEAD:fix/clipboard-r5-exact-copy
