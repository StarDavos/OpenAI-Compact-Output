services:
  compact-code-viewer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-compact-code-viewer:local}
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${CONTAINER_PORT:-8787}
    ports:
      - "127.0.0.1:${HOST_PORT:-8787}:${CONTAINER_PORT:-8787}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks:
      - compact-code-private

networks:
  compact-code-private:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
